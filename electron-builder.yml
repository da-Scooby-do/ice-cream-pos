# بناء برنامج ويندوز | Windows installer (electron-builder).
# CI builds it on a Windows runner (.github/workflows/desktop.yml) and
# publishes it to GitHub Releases, where the app's auto-updater finds it.
appId: com.jacice.pos
productName: JAC ICE POS
copyright: JAC ICE

directories:
  output: dist
  buildResources: build

# The Electron shell itself is tiny; the shop server ships as a resource.
files:
  - electron/**/*
  - package.json
# (node_modules and dot-folders are skipped by default, so they are listed explicitly)
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - "**/*"
      - "!.next{,/**}"
      - "!node_modules{,/**}"
  - from: .next/standalone/.next
    to: server/.next
    filter:
      - "**/*"
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - "**/*"

asar: true
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: JAC-ICE-POS-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: JAC ICE
  runAfterFinish: true
  deleteAppDataOnUninstall: false

publish:
  - provider: github
    owner: da-Scooby-do
    repo: ice-cream-pos
    releaseType: draft
