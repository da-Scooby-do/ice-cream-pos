name: Print test (Windows)
# تجربة الطباعة على ويندوز | prints a test receipt to a file printer on Windows
on:
  workflow_dispatch:
jobs:
  print:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Add a file printer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\printout | Out-Null
          "Drivers on this machine:"; Get-PrinterDriver | Format-Table Name
          $want = @('Microsoft Print To PDF', 'Microsoft XPS Document Writer v4', 'Microsoft XPS Document Writer')
          foreach ($d in $want) { try { Add-PrinterDriver -Name $d -ErrorAction Stop; "added driver $d" } catch { "cannot add $d" } }
          $have = (Get-PrinterDriver).Name
          $driver = $want | Where-Object { $have -contains $_ } | Select-Object -First 1
          if (-not $driver) { $driver = ($have | Select-Object -First 1) }
          "Using driver: $driver"
          Add-PrinterPort -Name 'C:\printout\job.out'
          Add-Printer -Name 'FilePrinter' -DriverName $driver -PortName 'C:\printout\job.out'
          Get-Printer | Format-Table Name, DriverName, PortName
      - name: Print the receipt four ways
        shell: pwsh
        env:
          TEST_PRINTER: FilePrinter
          TEST_FILE: C:\printout\job.out
          TEST_OUT: C:\printout\results
        run: npx electron tests/print/print-test.cjs
      - name: Report
        run: |
          pip install pymupdf --quiet
          python tests/print/xps-report.py C:\printout\results
      - uses: actions/upload-artifact@v4
        with:
          name: printouts
          path: C:\printout\results
