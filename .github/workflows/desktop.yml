# برنامج ويندوز | builds the Windows installer on a real Windows machine.
#   • push a tag like v2.0.1  → build, smoke-test, publish a GitHub Release
#     (the installed app updates itself from there)
#   • "Run workflow" by hand    → build + smoke-test, installer as an artifact
name: Desktop app (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build the shop server
        run: npm run desktop:build

      - name: Smoke test (starts the app, database, pages and print pipeline)
        run: npx electron . --smoke-test

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Build installer and publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: JAC-ICE-POS-Setup
          path: dist/*.exe
          if-no-files-found: error
