# برنامج ويندوز | builds the Windows installer on a real Windows machine.
#   • push a tag like v2.0.1, or "Run workflow" with publish ticked
#       → build, smoke-test, publish GitHub Release v<package.json version>
#         (the installed app updates itself from there)
#   • "Run workflow" with publish unticked → installer as a build artifact only
name: Desktop app (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (version from package.json)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build the shop server
        run: npm run desktop:build

      - name: Smoke test (starts the app, database, pages and print pipeline)
        run: npx electron . --smoke-test

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Tag the release (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.publish }}
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag" && git push origin "$tag"
          fi

      - name: Remove any half-published release for this version
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          # a failed run can leave a release without the installer; the updater
          # would then find no latest.yml. Start clean (the git tag is kept).
          for i in 1 2 3 4 5; do
            gh release view "$tag" >/dev/null 2>&1 || break
            gh release delete "$tag" --yes
          done
          # Create one draft up front: electron-builder uploads files in
          # parallel and would otherwise create a release per file.
          gh release create "$tag" --draft --title "$tag" --notes "JAC ICE POS $tag"

      - name: Build installer and publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make the release public
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx latest.yml
          gh release edit "$tag" --draft=false --latest

      - uses: actions/upload-artifact@v4
        with:
          name: JAC-ICE-POS-Setup
          path: dist/*.exe
          if-no-files-found: error
