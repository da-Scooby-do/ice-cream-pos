# برنامج ويندوز | builds the Windows installer on a real Windows machine.
#   • push a tag like v2.0.1, or "Run workflow" with publish ticked
#       → build, smoke-test, publish GitHub Release v<package.json version>
#         (the installed app updates itself from there)
#   • "Run workflow" with publish unticked → installer as a build artifact only
name: Desktop app (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (version from package.json)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build the shop server
        run: npm run desktop:build

      - name: Smoke test (starts the app, database, pages and print pipeline)
        run: npx electron . --smoke-test

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Build installer and publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: JAC-ICE-POS-Setup
          path: dist/*.exe
          if-no-files-found: error
